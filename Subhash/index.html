<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subhash Sharma – Contact</title>
<style>
  :root {
    --bg: #e8ebf4;
    --card: #ffffff;
    --ink: #1a2142;
    --muted: #5a6285;
    --accent: #3a56d4;
    --line: #d5daea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12162b;
      --card: #1c2240;
      --ink: #eef0fa;
      --muted: #a4abcb;
      --accent: #8da2ff;
      --line: #2e365c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 26px 26px;
    box-shadow: 0 10px 40px rgba(26, 33, 66, 0.12);
  }
  h1 { margin: 0 0 24px; font-size: 1.9rem; letter-spacing: -0.01em; }
  .role { margin: 4px 0 24px; color: var(--muted); }
  .save {
    display: block;
    text-align: center;
    padding: 14px;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 22px;
  }
  @media (prefers-color-scheme: dark) { .save { color: #12162b; } }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--line); }
  li a {
    display: block;
    padding: 14px 2px;
    color: var(--ink);
    text-decoration: none;
  }
  li span { display: block; font-size: 0.85rem; color: var(--muted); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>Subhash Sharma</h1>
  <p class="role">Stone Arts Kenya</p><a class="save" href="contact.vcf">Save to contacts</a>

  <ul>
    <li><a href="tel:+254113181818"><span>Company phone</span>+254 113 181818</a></li>
    <li><a href="tel:+254797827208"><span>Personal phone</span>+254 797 827208</a></li>
    <li><a href="mailto:subhash@stoneartskenya.com"><span>Email</span>subhash@stoneartskenya.com</a></li>
    <li><a href="https://www.stoneartskenya.com"><span>Website</span>www.stoneartskenya.com</a></li>
  </ul>
</main>
</body>
</html>
